name: adpilot

services:
  migrate:
    build:
      context: .
      target: builder
    image: adpilot-migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    # В docker-compose.prod.yml команда повторена с check-env в начале — менять шаги в обоих файлах
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      target: runner
    image: adpilot-web
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_TRUST_HOST: 'true'
      # standalone строит URL из HOSTNAME=0.0.0.0 — без AUTH_URL редиректы уходят на 0.0.0.0
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
    # /api/health: 200 при живой БД, 503 иначе (wget выходит с ошибкой на 503)
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: worker
    image: adpilot-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # внутри сети Compose мок живёт в сервисе web; localhost из .env был бы самим worker-ом
      MOCK_API_URL: http://web:3000/api/mock/direct
    # дать доделать текущий тик после SIGTERM
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      web:
        condition: service_started

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
